services:
  - type: web
    name: ailg
    # docker (thay vì python) chỉ để có ffmpeg cho câu 10.26 — xem Dockerfile.
    runtime: docker
    plan: starter
    # Chỉ chuyển lưu lượng khi bản mới đã trả lời được: build hay khởi động hỏng thì bản cũ
    # vẫn phục vụ, học viên không bị gián đoạn.
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: LARK_DOMAIN
        value: https://open.larksuite.com
      - key: LARK_APP_ID
        sync: false
      - key: LARK_APP_SECRET
        sync: false
      - key: LARK_REDIRECT_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: agentsee-data
      mountPath: /var/data
      sizeGB: 1
